<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — CommentFlow AI</title><link rel="stylesheet" href="/styles.css"><script src="/login.js" defer></script></head>
<body><main class="login-page"><p class="eyebrow">COMMENTFLOW AI · PRIVATE WORKSPACE</p><h1>Welcome back.</h1><p>Sign in to discover posts and prepare your comments.</p>
<!-- FEATURE/FUNCTION: Owner login. PURPOSE: Submit credentials only to this origin, without browser storage or URL parameters. -->
<form id="login-form" class="search-area"><div class="field"><label for="username">Owner username</label><input id="username" name="username" maxlength="100" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" maxlength="1024" autocomplete="current-password" required></div><button id="sign-in" class="primary" type="submit">Sign in</button><p id="login-status" role="status" aria-live="polite"></p></form></main></body></html>
